<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The World Cup Oracle | Savvy Football</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root{
      --green:#7f9900; --deep-green:#527800; --bright-green:#20d33a; --red:#ef2029;
      --white:#ffffff; --page:#ffffff; --card:#f5f2fa; --lav:#d9d0ea; --lav2:#eee9f6;
      --blue:#5c73b8; --text:#68686d; --dark:#4e5258; --pale:#eef1df; --line:#8aa10a;
      --display:'Bebas Neue', Impact, 'Arial Narrow', sans-serif; --body:'Montserrat', Arial, sans-serif;
    }
    *{box-sizing:border-box} html,body,#root{min-height:100%;} body{margin:0;background:var(--white);color:var(--text);font-family:var(--body);}
    button,select{font-family:inherit}.app{min-height:100vh;background:#fff;display:flex;justify-content:center;align-items:flex-start;padding:0}.shell{width:100%;max-width:480px;min-height:100vh;background:var(--card);position:relative;overflow:hidden}.blob{position:absolute;background:var(--lav);opacity:.8;border-radius:48% 52% 42% 58%;pointer-events:none}.b1{width:190px;height:420px;left:-145px;top:230px;transform:rotate(-15deg)}.b2{width:190px;height:250px;right:-95px;top:82px}.b3{width:250px;height:160px;right:-30px;bottom:-80px}.screen{position:relative;z-index:1;min-height:100vh;padding:22px 22px 28px}.landing{padding:0;display:flex;align-items:center;justify-content:center;background:#fff}.landingWrap{position:relative;width:100%;min-height:100vh;background:#f4f1f8;display:flex;align-items:center;justify-content:center;overflow:hidden}.landingImg{display:block;width:100%;height:100vh;object-fit:cover;object-position:center top}.landingHotspot{position:absolute;left:21%;right:15%;bottom:7.2%;height:7.2%;border:0;background:transparent;border-radius:24px;cursor:pointer;color:transparent}.landingFallbackBtn{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);border:0;background:var(--deep-green);color:#fff;border-radius:16px;padding:15px 28px;font-family:var(--display);font-size:26px;letter-spacing:.5px;display:none}.topLogo{text-align:center;margin:8px 0 14px}.topLogoText{font-family:var(--display);font-size:30px;line-height:.9;color:var(--blue);letter-spacing:.4px}.topLogoText span{color:var(--green)}.progressLabel{text-align:center;font-family:var(--display);font-size:22px;color:var(--green);letter-spacing:.6px;margin-bottom:10px}.progressTrack{height:10px;background:#dde8a8;border-radius:99px;overflow:hidden;margin:0 4px 26px}.progressBar{height:100%;background:var(--green);border-radius:99px;transition:width .25s ease}.quizCard{background:#fff;border:3px solid var(--line);border-radius:28px;padding:27px 19px 22px;box-shadow:0 3px 0 rgba(127,153,0,.06)}.eyebrow{font-family:var(--display);font-size:25px;color:var(--green);text-align:center;letter-spacing:.5px;margin-bottom:12px}.question{font-family:var(--body);font-size:24px;line-height:1.12;font-weight:900;text-align:center;color:var(--dark);margin:0 0 24px;letter-spacing:-.4px}.answers{display:grid;gap:12px}.answer{border:2px solid #d4dda8;background:#fff;border-radius:15px;text-align:left;color:var(--dark);font-size:15px;line-height:1.32;font-weight:800;padding:16px 15px;cursor:pointer;transition:.15s ease}.answer:hover,.answer.selected{border-color:var(--green);background:#f5f8e4;box-shadow:0 0 0 2px rgba(127,153,0,.12) inset}.nextBtn{width:100%;border:0;margin-top:19px;background:var(--green);color:#fff;border-radius:13px;padding:15px 16px;font-family:var(--display);font-size:25px;letter-spacing:.4px;cursor:pointer}.nextBtn:disabled{background:#b4c28d;cursor:not-allowed}.loading{text-align:center;padding-top:33vh}.spinner{width:76px;height:76px;border:8px solid #dfe8ae;border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 22px}@keyframes spin{to{transform:rotate(360deg)}}.loading h2{font-family:var(--display);color:var(--green);font-size:38px;line-height:.95;margin:0 0 12px}.loading p{font-weight:800;font-size:15px;line-height:1.45;margin:0 auto;max-width:310px}.resultScreen{background:#fff;padding:12px 10px 28px}.resultImageWrap{background:#fff;border-radius:22px;overflow:hidden}.resultImg{display:block;width:100%;height:auto;border-radius:20px}.dualNote{margin:14px 10px 0;background:#f2f5df;border:2px dashed var(--line);border-radius:16px;padding:12px 14px;text-align:center;color:var(--dark);font-weight:800;font-size:14px;line-height:1.35}.ctaPanel{margin:16px 10px 0;background:#f5f2fa;border-radius:20px;padding:16px 14px 18px;text-align:center;border:1px solid #e5dfef}.hint{font-size:13px;line-height:1.35;font-weight:800;margin:0 0 13px;color:var(--text)}.btn{width:100%;border:0;border-radius:13px;padding:14px 14px;margin:7px 0;color:#fff;font-family:var(--display);font-size:24px;letter-spacing:.3px;cursor:pointer;line-height:1}.share{background:var(--deep-green)}.download{background:var(--blue)}.whatsapp{background:var(--bright-green)}.challenge{background:#2d3f12}.secondaryRow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.smallBtn{border:0;background:#fff;color:var(--green);border:2px solid #d5dda5;border-radius:12px;padding:11px 8px;font-weight:900;font-size:12px;cursor:pointer}.linkBtn{border:0;background:transparent;color:var(--green);font-weight:900;text-decoration:underline;margin-top:9px;cursor:pointer}.modal{position:fixed;inset:0;background:rgba(40,40,40,.48);z-index:10;display:flex;align-items:center;justify-content:center;padding:20px}.modalBox{width:100%;max-width:430px;background:#fff;border:3px solid var(--line);border-radius:24px;padding:22px 18px;text-align:center}.modalBox h3{font-family:var(--display);font-size:36px;color:var(--green);line-height:.96;margin:0 0 10px}.modalBox p{font-weight:800;font-size:14px;line-height:1.42;color:var(--dark);margin:0 0 12px}.select{width:100%;border:2px solid #d4dda8;border-radius:13px;padding:13px;background:white;color:var(--dark);font-weight:800;margin-bottom:10px}.toast{position:fixed;z-index:20;left:50%;bottom:18px;transform:translateX(-50%);background:#2d3f12;color:white;border-radius:999px;padding:12px 17px;font-weight:800;font-size:13px;max-width:92%;text-align:center}.appealBox{margin:14px 10px 0;background:#fff4f5;border:2px solid #ffd0d3;border-radius:16px;padding:13px;color:var(--dark);font-weight:800;font-size:14px;line-height:1.38;text-align:center}@media (min-width:481px){.app{padding:18px;background:#fff}.shell{min-height:820px;border-radius:34px;box-shadow:0 20px 45px rgba(0,0,0,.12);overflow:hidden}.landingWrap,.landingImg{min-height:820px;height:820px}.landingHotspot{bottom:6.7%;}.screen{min-height:820px}.resultScreen{padding-top:18px}}@media (max-width:370px){.question{font-size:21px}.answer{font-size:14px;padding:14px}.screen{padding-left:16px;padding-right:16px}.resultScreen{padding-left:6px;padding-right:6px}.btn{font-size:21px}.secondaryRow{grid-template-columns:1fr}}
  </style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const APP_CONFIG={
  appUrl:'https://thefusestudios-code.github.io/SF-World-Cup-Oracle/',
  tournamentChallengeLink:'#'
};
const ASSETS={
  landing:'Savvy Oracle.png',
  plane:'plane clipart.png',
  results:{
    Brazil:'stamp-brazil.png',
    Argentina:'stamp-argentina.png',
    France:'stamp-france.png',
    Morocco:'stamp-morocco (1).png',
    England:'stamp-england.png',
    Germany:'stamp-germany (1).png',
    Spain:'stamp-spain.png',
    Portugal:'stamp-portugal.png'
  }
};
const WHATSAPP_LINKS={Brazil:'#',Argentina:'#',France:'#',Morocco:'#',England:'#',Germany:'#',Spain:'#',Portugal:'#'};
const RESULT_META={
  Brazil:{flag:'🇧🇷',archetype:'The Joy Merchant'},Argentina:{flag:'🇦🇷',archetype:'The Destiny Addict'},France:{flag:'🇫🇷',archetype:'The Talent Enjoyer'},Morocco:{flag:'🇲🇦',archetype:'The African Cousin'},England:{flag:'🏴',archetype:'The EPL Relative'},Germany:{flag:'🇩🇪',archetype:'The Ruthless Operator'},Spain:{flag:'🇪🇸',archetype:'The Possession Pastor'},Portugal:{flag:'🇵🇹',archetype:'The Legacy Lawyer'}
};
const WORLD_CUP_TEAMS=[['A','Mexico','🇲🇽'],['A','South Africa','🇿🇦'],['A','Korea Republic','🇰🇷'],['A','Czechia','🇨🇿'],['B','Canada','🇨🇦'],['B','Bosnia and Herzegovina','🇧🇦'],['B','Qatar','🇶🇦'],['B','Switzerland','🇨🇭'],['C','Brazil','🇧🇷'],['C','Morocco','🇲🇦'],['C','Haiti','🇭🇹'],['C','Scotland','🏴'],['D','United States','🇺🇸'],['D','Paraguay','🇵🇾'],['D','Australia','🇦🇺'],['D','Türkiye','🇹🇷'],['E','Germany','🇩🇪'],['E','Curaçao','🇨🇼'],['E',"Côte d'Ivoire",'🇨🇮'],['E','Ecuador','🇪🇨'],['F','Netherlands','🇳🇱'],['F','Japan','🇯🇵'],['F','Sweden','🇸🇪'],['F','Tunisia','🇹🇳'],['G','Belgium','🇧🇪'],['G','Egypt','🇪🇬'],['G','IR Iran','🇮🇷'],['G','New Zealand','🇳🇿'],['H','Spain','🇪🇸'],['H','Cabo Verde','🇨🇻'],['H','Saudi Arabia','🇸🇦'],['H','Uruguay','🇺🇾'],['I','France','🇫🇷'],['I','Senegal','🇸🇳'],['I','Iraq','🇮🇶'],['I','Norway','🇳🇴'],['J','Argentina','🇦🇷'],['J','Algeria','🇩🇿'],['J','Austria','🇦🇹'],['J','Jordan','🇯🇴'],['K','Portugal','🇵🇹'],['K','Congo DR','🇨🇩'],['K','Uzbekistan','🇺🇿'],['K','Colombia','🇨🇴'],['L','England','🏴'],['L','Croatia','🇭🇷'],['L','Ghana','🇬🇭'],['L','Panama','🇵🇦']].map(([group,country,flag])=>({group,country,flag}));
const QUESTION_POOL=[
 {slot:'grief',variants:[
  {q:'Nigeria did not qualify. What is your official coping strategy?',a:[['Choose joy. I refuse to suffer twice.','Brazil'],['Attach myself to football destiny and suffer beautifully.','Argentina'],['Adopt the strongest African agenda immediately.','Morocco'],['Find one superstar and argue for him till December.','Portugal']]},
  {q:'The Super Eagles are at home. Your World Cup emotion is now available for transfer. Where does your spirit go?',a:[['To skills, goals and enjoyment. Life is hard enough.','Brazil'],['To drama, tears and main-character football.','Argentina'],['To Africa. Somebody must carry the continent.','Morocco'],['To legacy debates. I came prepared with receipts.','Portugal']]}
 ]},
 {slot:'viewing',variants:[
  {q:'Your viewing centre loses signal during a big match. What do you do?',a:[['Start shouting but somehow make it entertaining.','Brazil'],['Blame the referee, CAF, FIFA and village people.','Argentina'],['Organise people calmly and find another screen.','Germany'],['Say this is why tactics matter more than vibes.','Spain']]},
  {q:'NEPA takes light just as the striker is through on goal. Your reaction?',a:[['Laugh first. If you do not laugh, you will cry.','Brazil'],['Fall to the floor like destiny has betrayed you.','Argentina'],['Ask who failed to buy fuel before kickoff.','Germany'],['Begin a tactical lecture nobody requested.','Spain']]}
 ]},
 {slot:'taste',variants:[
  {q:'Pick your football love language.',a:[['Skills, rhythm and irresponsible enjoyment.','Brazil'],['Passion, tears and dramatic redemption.','Argentina'],['Pace, power and squad depth that feels illegal.','France'],['Clean passing until opponents question their life.','Spain']]},
  {q:'What kind of goal gives you peace?',a:[['A dribble, a chop, another dribble, then disrespect.','Brazil'],['A 90th-minute winner after emotional damage.','Argentina'],['A counterattack so fast the camera almost gives up.','France'],['A 28-pass move that looks like a sermon.','Spain']]}
 ]},
 {slot:'groupchat',variants:[
  {q:'In the WhatsApp group, what is your matchday role?',a:[['Meme supplier and chief vibes officer.','Brazil'],['Long voice notes after every mistake.','England'],['African pride enforcement officer.','Morocco'],['Cold analyst with screenshots and receipts.','Germany']]},
  {q:'Your group chat is fighting after a controversial penalty. You are the person who...',a:[['Turns it into premium comedy immediately.','Brazil'],['Sends EPL comparisons even when nobody asked.','England'],['Reminds everyone Africa has been cheated before.','Morocco'],['Drops frame-by-frame analysis like VAR assistant.','Germany']]}
 ]},
 {slot:'penalties',variants:[
  {q:'Penalty shootout starts. What is your body doing?',a:[['Laughing loudly to hide fear.','Brazil'],['Praying, bargaining and remembering ancestors.','Argentina'],['Calculating goalkeeper tendencies like a data scientist.','Germany'],['Already preparing excuses in case of nonsense.','England']]},
  {q:'Your adopted country needs one penalty to survive. What are you trusting?',a:[['Pure vibes and audacity.','Brazil'],['Tears, destiny and one dramatic close-up.','Argentina'],['Preparation, order and German-level seriousness.','Germany'],['The hope that this is finally not heartbreak again.','England']]}
 ]},
 {slot:'trust',variants:[
  {q:'What type of team do you secretly trust?',a:[['The one with outrageous attackers everywhere.','France'],['The one with one unavoidable main character.','Portugal'],['The one carrying continental responsibility.','Morocco'],['The one that controls the ball and your blood pressure.','Spain']]},
  {q:'Choose your tournament insurance policy.',a:[['Bench full of players who would start elsewhere.','France'],['One superstar who can bend the story by force.','Portugal'],['An African team defending respect with full chest.','Morocco'],['Possession, patience and spiritual ball control.','Spain']]}
 ]},
 {slot:'loss',variants:[
  {q:'Your adopted country loses. What is your first statement?',a:[['At least we entertained the world.','Brazil'],['Football is pain. I will be back tomorrow.','Argentina'],['The system failed only in small details.','Germany'],['The media pressure was too much, please.','England']]},
  {q:'After heartbreak, how do you defend your embassy?',a:[['Nobody can deny the enjoyment.','Brazil'],['This is just chapter one of the destiny arc.','Argentina'],['The process was correct. Execution betrayed us.','Germany'],['These boys are young. Give them another tournament.','England']]}
 ]},
 {slot:'prophecy',variants:[
  {q:'Choose your World Cup prophecy style.',a:[['Vibes will carry us where tactics cannot explain.','Brazil'],['Suffering first, glory later. That is football heritage.','Argentina'],['Africa is not going there to clap for anybody.','Morocco'],['Big players decide big tournaments. Simple.','Portugal']]},
  {q:'The Oracle asks for your final tournament belief. You say:',a:[['Football must be enjoyed or reported to the authorities.','Brazil'],['Destiny always looks messy before the trophy.','Argentina'],['The continent has unfinished business.','Morocco'],['Legacy does not sleep during World Cups.','Portugal']]}
 ]}
];
function chooseQuestions(){return QUESTION_POOL.map(slot=>slot.variants[Math.floor(Math.random()*slot.variants.length)]);}
function App(){const [screen,setScreen]=React.useState('home');const [questions,setQuestions]=React.useState(()=>chooseQuestions());const [i,setI]=React.useState(0);const [answers,setAnswers]=React.useState([]);const [selected,setSelected]=React.useState('');const [result,setResult]=React.useState('');const [modal,setModal]=React.useState(null);const [dual,setDual]=React.useState('');const [appeal,setAppeal]=React.useState(false);const [toast,setToast]=React.useState('');
 const showToast=t=>{setToast(t);setTimeout(()=>setToast(''),2600)};
 const start=()=>{setQuestions(chooseQuestions());setI(0);setAnswers([]);setSelected('');setResult('');setDual('');setAppeal(false);setScreen('quiz');window.scrollTo(0,0)};
 const next=()=>{const na=[...answers,selected];setAnswers(na);setSelected('');if(i<questions.length-1){setI(i+1);window.scrollTo(0,0)}else{setScreen('loading');setTimeout(()=>{setResult(calculate(na));setScreen('result');window.scrollTo(0,0)},1150)}};
 const calculate=arr=>{const order=['Brazil','Argentina','France','Morocco','England','Germany','Spain','Portugal'];const scores=Object.fromEntries(order.map(c=>[c,0]));arr.forEach(c=>scores[c]++);return order.sort((a,b)=>scores[b]-scores[a]||order.indexOf(a)-order.indexOf(b))[0];};
 const share=async()=>{const meta=RESULT_META[result];const text=`The Oracle has spoken. I have been claimed by ${result} Embassy ${meta.flag}\nPassport type: ${meta.archetype}${dual?`\nEmotional attachment noted: ${dual}`:''}\n\nTake the World Cup Oracle test and collect your own emergency football passport: ${APP_CONFIG.appUrl}`;try{if(navigator.share){await navigator.share({title:'My World Cup Oracle Passport',text,url:APP_CONFIG.appUrl})}else{await navigator.clipboard.writeText(text);showToast('Passport share text copied. Paste it in WhatsApp, X, Instagram or your group chat.')}}catch(e){showToast('Share cancelled. Screenshot evidence is still allowed.')}};
 const download=()=>{const a=document.createElement('a');a.href=ASSETS.results[result];a.download=`world-cup-oracle-${result.toLowerCase()}-passport.png`;document.body.appendChild(a);a.click();a.remove();showToast('Passport image download started.');};
 const openLink=url=>{if(!url||url==='#')showToast('Placeholder link. Add the real campaign URL in the code.');else window.open(url,'_blank')};
 return <div className="app"><div className="shell">{screen!=='home'&&screen!=='result'&&<><div className="blob b1"></div><div className="blob b2"></div><div className="blob b3"></div></>}{screen==='home'&&<Landing start={start}/>} {screen==='quiz'&&<Quiz q={questions[i]} i={i} selected={selected} setSelected={setSelected} next={next}/>} {screen==='loading'&&<Loading/>} {screen==='result'&&result&&<Result result={result} dual={dual} share={share} download={download} start={start} setModal={setModal} appeal={appeal} setAppeal={setAppeal} openLink={openLink}/>} {modal==='dual'&&<DualModal result={result} setDual={setDual} setModal={setModal}/>} {toast&&<div className="toast">{toast}</div>}</div></div>}
function Landing({start}){return <div className="landing"><div className="landingWrap"><img className="landingImg" src={ASSETS.landing} alt="The World Cup Oracle landing page"/><button className="landingHotspot" onClick={start} aria-label="Assign my passport">Assign My Passport</button><button className="landingFallbackBtn" onClick={start}>Assign My Passport</button></div></div>}
function Quiz({q,i,selected,setSelected,next}){return <main className="screen"><div className="topLogo"><div className="topLogoText"><span>THE</span><br/>WORLD CUP<br/>ORACLE</div></div><div className="progressLabel">Passport Application {i+1}/8</div><div className="progressTrack"><div className="progressBar" style={{width:`${((i+1)/8)*100}%`}}></div></div><section className="quizCard"><div className="eyebrow">Ministry Question</div><h1 className="question">{q.q}</h1><div className="answers">{q.a.map(([text,country])=><button key={text} className={'answer '+(selected===country?'selected':'')} onClick={()=>setSelected(country)}>{text}</button>)}</div><button className="nextBtn" disabled={!selected} onClick={next}>{i===7?'Submit To Oracle':'Next Question'}</button></section></main>}
function Loading(){return <main className="screen loading"><div className="spinner"></div><h2>The Oracle is reviewing your file...</h2><p>Checking your football spirit. Consulting VAR spiritually. Ignoring objections.</p></main>}
function Result({result,dual,share,download,start,setModal,appeal,setAppeal,openLink}){return <main className="screen resultScreen"><div className="resultImageWrap"><img className="resultImg" src={ASSETS.results[result]} alt={`${result} emergency football passport result card`}/></div>{dual&&<div className="dualNote"><b>Dual Citizenship Note:</b><br/>You have emotionally attached yourself to {dual}. The Ministry has noted it, but your official passport remains {result}.</div>}{appeal&&<div className="appealBox"><b>Appeal filed.</b><br/>The Ministry can reopen your case, but suspicious answer changes may be used against you.</div>}<section className="ctaPanel"><p className="hint"><b>Passport stamped.</b><br/>Screenshot this passport before sharing. Evidence may be required in the group chat.</p><button className="btn share" onClick={share}>Share My Passport</button><button className="btn download" onClick={download}>Download Passport Image</button><button className="btn whatsapp" onClick={()=>openLink(WHATSAPP_LINKS[result])}>Join My Embassy WhatsApp Group</button><button className="btn challenge" onClick={()=>openLink(APP_CONFIG.tournamentChallengeLink)}>Join Tournament Challenge</button><div className="secondaryRow"><button className="smallBtn" onClick={()=>setModal('dual')}>Add Dual Citizenship</button><button className="smallBtn" onClick={()=>setAppeal(true)}>Appeal Result</button></div><button className="linkBtn" onClick={start}>Retake Test</button></section></main>}
function DualModal({result,setDual,setModal}){const [choice,setChoice]=React.useState('');return <div className="modal"><div className="modalBox"><h3>Declare Your Emotional Attachment</h3><p>Your Oracle passport remains official. But if your heart already belongs elsewhere, the Ministry will note it for emotional reasons.</p><select className="select" value={choice} onChange={e=>setChoice(e.target.value)}><option value="">Select your side country</option>{WORLD_CUP_TEAMS.map(t=><option key={t.group+t.country} value={`${t.flag} ${t.country}`}>Group {t.group} — {t.flag} {t.country}</option>)}</select><button className="btn share" disabled={!choice} onClick={()=>{setDual(choice);setModal(null)}}>Note My Side Country</button><button className="linkBtn" onClick={()=>setModal(null)}>Cancel</button></div></div>}
ReactDOM.render(<App/>,document.getElementById('root'));
</script>
</body>
</html>
